name: Deploy Order Service

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build application
        run: ./mvnw clean package -DskipTests

      - name: Copy JAR to VM
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT }}
          source: "target/order_service-0.0.1-SNAPSHOT.jar"
          target: "/home/dinuka0512/kade_be/kade_order_service/target"

      - name: Restart Order Service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT }}

          script: |
            cd /home/dinuka0512/kade_be/kade_order_service

            JAVA="/home/dinuka0512/.sdkman/candidates/java/current/bin/java"

            echo "Stopping old Order Service..."

            OLD_PID=$(ss -lntp 2>/dev/null | grep ':8003' | grep -o 'pid=[0-9]*' | cut -d= -f2 || true)

            if [ -n "$OLD_PID" ]; then
              echo "Found Order Service PID: $OLD_PID"
              kill $OLD_PID || true
              sleep 5
            fi

            echo "Starting new Order Service..."

            nohup "$JAVA" \
              -jar target/order_service-0.0.1-SNAPSHOT.jar \
              > order.log 2>&1 < /dev/null &

            echo "Waiting for Order Service to start..."

            for i in {1..30}; do
              echo "Attempt $i/30..."

              if curl -s -f http://localhost:8003/orders > /dev/null; then
                echo "Order Service deployed successfully!"
                exit 0
              fi

              sleep 2
            done

            echo "Order Service failed to start!"
            echo "========== ORDER LOG =========="
            tail -100 order.log
            exit 1
